name: Testes e entrega

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testes de unidade e cobertura
        run: npm run test:coverage
      - name: Instalar Chromium e dependências no Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Instalar Chromium no macOS e no Windows
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Testes end-to-end
        run: npm run test:e2e
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios-${{ matrix.os }}
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  codecov:
    name: Publicar cobertura no Codecov
    needs: test
    if: github.event_name != 'pull_request' && vars.ENABLE_CODECOV == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: relatorios-ubuntu-latest
          path: reports
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: reports/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
